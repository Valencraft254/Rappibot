<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Embed Creator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🟧 Discord Embed Creator</h1>

<div class="container">

    <div class="editor">

        <h2>Crear Embed</h2>

        <input id="title" placeholder="Título del embed">

        <textarea id="description" placeholder="Descripción"></textarea>

        <label>Color</label>
        <input id="color" type="color" value="#ff8800">

        <input id="thumbnail" placeholder="URL Thumbnail">

        <input id="image" placeholder="URL Imagen grande">

        <input id="footer" placeholder="Texto del footer">

        <button onclick="generar()">⚙️ Generar código</button>

        <button onclick="copiar()">📋 Copiar comando</button>

        <p id="codigo">Aquí aparecerá tu código</p>

    </div>


    <div class="preview">

        <h2>Vista previa</h2>

        <div class="discord">

            <div id="embed">

                <img id="pThumbnail" class="thumbnail">

                <h3 id="pTitle">Título del embed</h3>

                <p id="pDescription">
                    Descripción del embed
                </p>

                <img id="pImage" class="image">

                <hr>

                <small id="pFooter">
                    Footer
                </small>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
